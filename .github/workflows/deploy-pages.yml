name: Deploy SDVGacha to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot Engine 4.3 and Templates
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.local/share/godot/templates/4.3.stable
          mkdir -p ~/.config/godot/export_templates/4.3.stable
          mkdir -p ~/.config/godot/templates/4.3.stable

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/
          cp -r templates/* ~/.local/share/godot/templates/4.3.stable/
          cp -r templates/* ~/.config/godot/export_templates/4.3.stable/
          cp -r templates/* ~/.config/godot/templates/4.3.stable/

      - name: Configure Explicit Template Paths
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          sed -i "s|custom_template/release=\"\"|custom_template/release=\"$TEMPLATES_DIR/web_nothreads_release.zip\"|g" game/export_presets.cfg
          sed -i "s|custom_template/debug=\"\"|custom_template/debug=\"$TEMPLATES_DIR/web_nothreads_debug.zip\"|g" game/export_presets.cfg
          echo "=== EXPORT PRESETS CONFIG ==="
          cat game/export_presets.cfg

      - name: Import Assets & Export Web Game
        run: |
          cd game
          mkdir -v -p build/web
          # Step 1: Headless import pass to build .godot cache
          godot --headless --editor --quit || true
          
          # Step 2: Clean export pass
          godot -v --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
